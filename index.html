<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>내 파일 다운로드 사이트</title>

  <style>
    :root {
      --bg: #f5f5f5;
      --text: #222;
      --box: #ffffff;
      --btn: #4CAF50;
    }

    body.dark {
      --bg: #121212;
      --text: #f1f1f1;
      --box: #1e1e1e;
      --btn: #66bb6a;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 30px;
      transition: 0.3s;
    }

    h1 { margin-bottom: 10px; }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .dark-btn {
      background: #333;
      color: white;
    }

    #searchInput {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .file-box {
      background: var(--box);
      padding: 20px;
      border-radius: 12px;
      max-width: 520px;
      max-height: 320px;
      overflow-y: auto;
    }

    .file-item {
      margin-bottom: 15px;
    }

    .download-btn {
      display: inline-block;
      margin-top: 5px;
      padding: 8px 12px;
      background: var(--btn);
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>📁 내 파일 저장소</h1>

  <div class="top-bar">
    🌙 <button class="dark-btn" onclick="toggleDark()">다크모드</button>
  </div>

  <input type="text" id="searchInput" placeholder="파일 검색..." onkeyup="searchFiles()">

  <div class="file-box">

    <div class="file-item">
      <strong>마인크래프트 레거시 런처 설치 파일</strong><br>
      <a class="download-btn"
         href="https://drive.google.com/uc?export=download&id=13NJs4MlYnf05-HJG3dlRRoQ27zg6ExWk">
         ⬇ 다운로드
      </a>
    </div>

    <div class="file-item">
      <strong>study.pdf</strong><br>
      <a class="download-btn"
         href="https://drive.google.com/uc?export=download&id=파일ID2">
         ⬇ 다운로드
      </a>
    </div>

    <div class="file-item">
      <strong>photo.png</strong><br>
      <a class="download-btn"
         href="https://drive.google.com/uc?export=download&id=파일ID3">
         ⬇ 다운로드
      </a>
    </div>

  </div>

  <script>
    function toggleDark() {
      document.body.classList.toggle("dark");
    }

    function searchFiles() {
      let input = document.getElementById("searchInput").value.toLowerCase();
      let items = document.getElementsByClassName("file-item");
      for (let item of items) {
        item.style.display =
          item.innerText.toLowerCase().includes(input) ? "" : "none";
      }
    }
  </script>

</body>
</html>
